name: Cruzamentos do eleitorado (TSE)

on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano da eleição (ex.: 2022 ou 2026)"
        required: true
        default: "2022"

permissions:
  contents: write

jobs:
  cruzamentos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install pandas openpyxl

      - name: Rodar cruzamentos
        run: python analisar_eleitorado.py "${{ github.event.inputs.ano }}"

      - name: Salvar resultados no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add resultados/
          git commit -m "Cruzamentos eleitorado ${{ github.event.inputs.ano }} (SP, capital e RMSP)" || echo "Nada novo"
          git push
